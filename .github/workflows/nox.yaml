name: nox

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

jobs:
  run-nox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # - uses: actions/setup-python@v5
      - uses: wntrblm/nox@2025.02.09
      - run: pipx run nox --forcecolor
